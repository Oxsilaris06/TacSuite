name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install poppler-utils (required by tests/pdf/verify-structure.mjs)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Generate PDF from reference fixture
        run: node tests/pdf/generate-from-fixture.mjs tests/pdf/fixtures/long-case.json --out=/tmp/ci-long-case.pdf

      # 18/18 requis (A1-A8 + B1/B2/B5/B6/B9 + C1-C5, mission P4 « une page =
      # un usage », commit a57b128). --fixture active C5 (anti-troncature
      # étendue) contre la MÊME fixture que la génération — zéro désaccord de
      # données possible (cf. tests/pdf/README.md).
      - name: PDF structural non-regression (verify-structure)
        run: node tests/pdf/verify-structure.mjs /tmp/ci-long-case.pdf --lenient --fixture=tests/pdf/fixtures/long-case.json

      - name: Generate PDF from volumetric-stress fixture (R4-b/P4 gate)
        run: node tests/pdf/generate-from-fixture.mjs tests/pdf/fixtures/volumetric-stress.json --out=/tmp/ci-volumetric-stress.pdf

      - name: PDF structural non-regression — volumetric gate (verify-structure, 18/18 requis)
        run: node tests/pdf/verify-structure.mjs /tmp/ci-volumetric-stress.pdf --photos=58 --fixture=tests/pdf/fixtures/volumetric-stress.json

      # real-shape.json (correctif Nico 2026-08-10) : mêmes STRUCTURES que
      # l'archive OI réelle ayant révélé le bug « fiche adversaire avec photo
      # déborde sur une page orpheline » (photo non comptée dans le solveur
      # fit-to-page) et le bug « carte hypothèse : texte hors du fond » —
      # données 100 % synthétiques anonymes (photo de portrait synthétique,
      # ATCD multi-lignes, hypothèses à description longue + champs mixtes
      # courts/longs). Non-régression permanente de ces deux correctifs.
      - name: Generate PDF from real-shape fixture (fiche adversaire photo + carte hypothèse gate)
        run: node tests/pdf/generate-from-fixture.mjs tests/pdf/fixtures/real-shape.json --out=/tmp/ci-real-shape.pdf

      - name: PDF structural non-regression — real-shape gate (verify-structure, 18/18 requis)
        run: node tests/pdf/verify-structure.mjs /tmp/ci-real-shape.pdf --lenient --photos=2 --fixture=tests/pdf/fixtures/real-shape.json
