name: E2E (manuel)

# Declenchement manuel uniquement : le cron nocturne a ete retire (il publiait
# chaque nuit un rapport d'echec sans que personne ne le traite).
on:
  workflow_dispatch:

# Moindre privilège (revue de sécurité du 2026-09-26, D-10).
permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (chromium)
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Start preview server (port 9678)
        # tests/e2e/offline.spec.ts cible explicitement le serveur de PREVIEW
        # (build de prod + Service Worker), PAS `npm run dev` — cf. en-tête du
        # fichier. playwright.config.ts n'a pas de `webServer` automatique
        # (baseURL 127.0.0.1:9678, serveur lancé manuellement), donc on le
        # démarre ici en arrière-plan avant `npm run test:e2e`.
        run: |
          npx vite preview --port 9678 --strictPort > /tmp/preview.log 2>&1 &
          echo $! > /tmp/preview.pid
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9678/ | grep -q 200; then
              echo "Preview server ready"
              exit 0
            fi
            sleep 1
          done
          echo "Preview server did not respond after 30s" >&2
          cat /tmp/preview.log >&2
          exit 1

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Stop preview server
        if: always()
        run: kill "$(cat /tmp/preview.pid)" 2>/dev/null || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
